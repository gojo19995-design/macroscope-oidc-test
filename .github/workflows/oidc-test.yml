name: OIDC Test
on: workflow_dispatch
permissions: { id-token: write, contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=macroscope" | jq -r .value)
          echo "token_len=${#T}"
          curl -s -X POST "https://actions.macroscope.com/api/v1/github-actions/agent-runs" -H "Content-Type: application/json" -H "Authorization: Bearer $T" -d '{"repository":"gojo19995-design/macroscope-oidc-test","review":{"kind":"cra"},"commit":"PLACEHOLDER"}' -w "\nHTTP:%{http_code}\n"
